<?xml version="1.0" encoding="UTF-8"?>
<!-- Test fixture: a small service manager configuration in the shape of
     /jci/sm/sm.conf on firmware 74.00.324. Written for the HUDLink tests;
     it is not a copy of the head unit's file. -->
<sm_config>
    <services>
        <service type="jci_service" name="jciVBS" path="/jci/vbs/svcjcivbs.so" autorun="yes" reset_board="yes" retry_count="0">
            <dependency type="service" value="devicemanager"/>
        </service>

        <service type="jci_service" name="jciCARPLAY" path="/jci/carplay/blmjcicarplay.so" autorun="yes" reset_board="no" retry_count="0" ping_timeout="90000" stop_timeout="40000">
            <environ_var env_name="LD_PRELOAD" env_value="/data_persist/cp-hud-mod/libpatch-blmjcicarplay.so"/>
            <environ_var env_name="LD_LIBRARY_PATH" env_value="/jci/lib:/jci/opera/3rdpartylibs/freetype:/usr/lib/imx-mm/audio-codec:/usr/lib/imx-mm/parser:/data_persist/dev/lib:"/>
            <dependency type="service" value="carplayd"/>
            <dependency type="service" value="devicemanager"/>
            <dependency type="service" value="audio_manager"/>
        </service>

        <!-- Another mod's entry: HUDLink must leave it alone. -->
        <service type="jci_service" name="jciAAPA" path="/jci/aapa/blmjciaapa.so" autorun="yes" reset_board="yes" retry_count="0">
            <environ_var env_name="LD_PRELOAD" env_value="/data_persist/other-mod/libpatch-blmjciaapa.so"/>
            <dependency type="service" value="devicemanager"/>
        </service>
    </services>
</sm_config>
